<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <h1 id="Hello">Witaj na mojej stronie</h1>
    <button id="send" onclick="send()">Wyslij</button>

    <form>
        <label for="price">Cena</label>
        <input type="number" id="price" name="price"><br>

        <label for="amount">Ilosc</label>
        <input type="number" id="amount" name="amount"><br>
        <button type = "button"     onclick="calculate()">Oblicz</button>

        <p id="result">Sasdasd</p>

        <input type="number" id="length" name="length"><br>

        <label for = "width">Dlugosc</label>
        <input type="number" id="width" name="width"><br>

        <label for = "type">Plytka</label>
        <input type="number" id="type" name="type"><br>
        
    </form>


    <script>
        function send(){
            let text = document.getElementById("Hello").textContent="Udalo ci sie";
        }
        function calculate(){
            let price = document.getElementById("price").value;
            let amount = document.getElementById("amount").value;
            let result = price * amount;
            document.getElementById("result").textContent = "Cena to: " + result;
        }
    </script>
</body>
